<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:var(--room);color:var(--ink);font-family:var(--sans)">
<div style="position:absolute;left:10px;top:120px;width:370px;height:392px;border-radius:50%;background:var(--rail)"><div style="position:absolute;inset:13px;border-radius:50%;background:var(--felt-bg);box-shadow:inset 0 0 70px rgba(0,0,0,.55)"></div></div>
<div style="position:absolute;inset:0;background:var(--scrim)"></div>
<div style="position:absolute;left:0;right:0;top:132px;bottom:0;padding:10px 16px 0;border-radius:28px 28px 0 0;background:var(--surface);box-shadow:var(--sh2)">
<div style="margin:0 auto 12px;width:40px;height:5px;border-radius:3px;background:var(--line)"></div>
<div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 4px">
<div style="font-family:var(--display);font-size:26px;font-weight:600"><span style="color:var(--gold-ink)">♛</span> Host controls</div>
<div style="font-size:12px;color:var(--ink3);font-weight:700;font-variant-numeric:tabular-nums">Pool ₹1,240</div>
</div>
<div style="margin-top:14px;height:58px;border-radius:18px;background:var(--gold-grad);box-shadow:var(--gold-sh);color:var(--on-gold);display:grid;place-items:center;font-weight:800;font-size:16px">End game &amp; pick winner</div>
<div style="margin-top:18px;padding:0 4px;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ink3)">WHOSE TURN</div>
<div style="margin-top:8px;display:flex;gap:8px">
<sc-for list="{{turn}}" as="p" hint-placeholder-count="6"><div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;opacity:{{p.op}}"><div style="width:46px;height:46px;box-sizing:border-box;border-radius:23px;background:{{p.color}};border:{{p.b}};box-shadow:{{p.sh}};display:grid;place-items:center;color:#f6eedb;font-size:14px;font-weight:800">{{p.ini}}</div><div style="font-size:11.5px;font-weight:700">{{p.name}}</div></div></sc-for>
</div>
<div style="margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="3"><div style="height:74px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:0 12px"><div style="font-size:18px;color:var(--gold-ink)">{{t.i}}</div><div style="font-size:13px;font-weight:800;margin-top:4px">{{t.l}}</div><div style="font-size:11px;color:var(--ink3);font-weight:600">{{t.d}}</div></div></sc-for>
</div>
<div style="margin-top:18px;padding:0 4px;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ink3)">PLAYERS</div>
<div style="margin-top:6px">
<sc-for list="{{players}}" as="p" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:10px;height:56px;border-bottom:1px solid var(--line)">
<div style="width:36px;height:36px;border-radius:18px;background:{{p.color}};display:grid;place-items:center;color:#f6eedb;font-size:12px;font-weight:800">{{p.ini}}</div>
<div style="flex:1"><div style="font-size:14.5px;font-weight:700">{{p.name}}</div><div style="font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums">{{p.w}}</div></div>
<div style="height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:700">Cash out</div>
<div style="height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--down);color:var(--down);display:grid;place-items:center;font-size:12.5px;font-weight:700">Remove</div>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const P = [['Arjun','AR','#9a6a2f','₹1,880'],['Meera','ME','#2f8a74','₹2,310'],['Kabir','KA','#6a4f96','₹1,450'],['Rahul','RA','#3d6a9a','₹2,940'],['Dev','DE','#5f6f3a','₹1,960 · packed'],['Priya','PR','#9a4a5a','₹3,450']];
    return {
      turn: P.map(([name,ini,color,w]) => ({name,ini,color, op: name === 'Dev' ? .4 : 1,
        b: name === 'Rahul' ? '3px solid #f1d590' : '2px solid transparent', sh: name === 'Rahul' ? 'var(--glow)' : 'none'})),
      tiles: [{i:'⇄',l:'Edit teams',d:'2 teams'},{i:'↺',l:'Undo log',d:'3 undos'},{i:'♛',l:'Transfer host',d:'Hand it over'}],
      players: P.slice(1,5).map(([name,ini,color,w]) => ({name,ini,color,w})),
    };
  }
}
</script>
</body>
</html>
