<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:var(--room);color:var(--ink);font-family:var(--sans)">
<div style="padding:56px 16px 0;display:flex;align-items:center;gap:10px">
<div style="width:44px;height:44px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2;stroke-linecap:round"><path d="M15 5l-7 7 7 7"></path></svg></div>
<div style="padding:7px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line-gold);font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--gold-ink)">K7Q2PX</div>
</div>
<div style="padding:22px 22px 0">
<div style="font-family:var(--display);font-size:34px;font-weight:600;line-height:1.1">Who’s playing?</div>
<div style="font-size:14px;color:var(--ink2);margin-top:6px">Friday Night Crew · hosted by Arjun</div>
</div>
<div style="margin:20px 16px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="9">
<div style="position:relative;height:118px;border-radius:20px;background:{{p.bg}};border:{{p.border}};box-shadow:{{p.sh}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:{{p.op}}">
<div style="width:56px;height:56px;border-radius:28px;background:{{p.color}};display:grid;place-items:center;color:#f6eedb;font-weight:800;font-size:18px">{{p.ini}}</div>
<div style="font-size:14px;font-weight:700">{{p.name}}</div>
<sc-if value="{{p.taken}}" hint-placeholder-val="{{false}}"><div style="position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--ink3)">AT TABLE</div></sc-if>
<sc-if value="{{p.sel}}" hint-placeholder-val="{{false}}"><div style="position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:11px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-size:13px;font-weight:900">✓</div></sc-if>
</div>
</sc-for>
<div style="height:118px;border-radius:20px;border:1.5px dashed var(--line-gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--gold-ink)">
<div style="width:56px;height:56px;border-radius:28px;border:1.5px dashed var(--line-gold);display:grid;place-items:center;font-size:28px;font-weight:300">+</div>
<div style="font-size:14px;font-weight:700">New name</div>
</div>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:16px 16px 34px;background:linear-gradient(transparent,var(--bg) 30%)">
<div style="height:58px;border-radius:18px;background:var(--gold-grad);box-shadow:var(--gold-sh);color:var(--on-gold);display:grid;place-items:center;font-weight:800;font-size:16.5px">Take a seat as Priya</div>
<div style="text-align:center;font-size:12.5px;color:var(--ink3);margin-top:10px;font-weight:600">No login. Your name is remembered on this phone.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const L = [['Arjun','AR','#9a6a2f',1],['Rahul','RA','#3d6a9a',1],['Meera','ME','#2f8a74',1],['Priya','PR','#9a4a5a',0,1],['Kabir','KA','#6a4f96'],['Dev','DE','#5f6f3a'],['Sana','SA','#8a3f7a'],['Ishaan','IS','#3f7f8a']];
    return { people: L.map(([name,ini,color,taken,sel]) => ({name,ini,color,taken:!!taken,sel:!!sel,
      op: taken ? .45 : 1,
      bg: sel ? 'var(--surface3)' : 'var(--surface)',
      border: sel ? '2px solid var(--gold)' : '1px solid var(--line)',
      sh: sel ? 'var(--glow)' : 'none'})) };
  }
}
</script>
</body>
</html>
