<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:390px;height:1180px;overflow:hidden;background:var(--room);color:var(--ink);font-family:var(--sans)">
<div style="padding:56px 16px 0;display:flex;align-items:center;gap:10px">
<div style="width:44px;height:44px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2;stroke-linecap:round"><path d="M15 5l-7 7 7 7"></path></svg></div>
<div style="flex:1;font-family:var(--display);font-size:22px;font-weight:600">Game template</div>
<div style="font-size:14px;font-weight:800;color:var(--gold-ink)">Save</div>
</div>
<div style="padding:16px 16px 0;display:flex;gap:8px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="4"><div style="height:40px;padding:0 14px;border-radius:20px;border:1px solid {{p.b}};background:{{p.bg}};color:{{p.c}};display:grid;place-items:center;font-size:13.5px;font-weight:800">{{p.l}}</div></sc-for>
</div>
<div style="margin:16px 16px 0;padding:4px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line)">
<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ink3)">NAME</div><div style="font-family:var(--display);font-size:22px;font-weight:600;margin-top:2px">Teen Patti</div></div>
<sc-for list="{{amounts}}" as="a" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:12px;min-height:66px;border-bottom:1px solid var(--line)">
<div style="flex:1"><div style="font-size:15px;font-weight:700">{{a.l}}</div><div style="font-size:12px;color:var(--ink3)">{{a.d}}</div></div>
<div style="display:flex;align-items:center;gap:6px"><div style="width:40px;height:40px;border-radius:20px;background:var(--surface2);display:grid;place-items:center;font-size:20px">−</div><div style="min-width:70px;text-align:center;font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:lining-nums tabular-nums">{{a.v}}</div><div style="width:40px;height:40px;border-radius:20px;background:var(--surface2);display:grid;place-items:center;font-size:20px">+</div></div>
</div>
</sc-for>
<div style="padding:14px 0">
<div style="display:flex;align-items:center;gap:12px"><div style="flex:1"><div style="font-size:15px;font-weight:700">Blind / Seen</div><div style="font-size:12px;color:var(--ink3)">Seen players bet a multiple of blind</div></div><div style="width:52px;height:32px;border-radius:16px;background:var(--gold);position:relative"><div style="position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#fffaf0;box-shadow:0 1px 3px rgba(0,0,0,.3)"></div></div></div>
<div style="margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:14px;background:var(--surface3)"><div style="height:38px;display:grid;place-items:center;font-weight:700;font-size:13.5px;color:var(--ink2)">1.5×</div><div style="height:38px;border-radius:11px;background:var(--surface);box-shadow:var(--sh1);display:grid;place-items:center;font-weight:800;font-size:13.5px">2× seen</div><div style="height:38px;display:grid;place-items:center;font-weight:700;font-size:13.5px;color:var(--ink2)">3×</div></div>
</div>
</div>
<div style="margin:12px 16px 0;padding:14px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<div><div style="font-size:15px;font-weight:700">{{m.l}}</div><div style="font-size:12px;color:var(--ink3);margin-bottom:8px">{{m.d}}</div>
<div style="display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:14px;background:var(--surface3)"><div style="height:40px;border-radius:11px;background:var(--surface);box-shadow:var(--sh1);display:grid;place-items:center;font-weight:800;font-size:13.5px">{{m.a}}</div><div style="height:40px;display:grid;place-items:center;font-weight:700;font-size:13.5px;color:var(--ink2)">{{m.b}}</div></div></div>
</sc-for>
</div>
<div style="margin:12px 16px 0;padding:14px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line-gold);display:flex;align-items:center;gap:12px">
<div style="flex:1"><div style="font-size:15px;font-weight:700">Confirm bets above</div><div style="font-size:12px;color:var(--ink3)">Big bets ask “Place ₹X?” first</div></div>
<div style="font-family:var(--display);font-size:22px;font-weight:700;color:var(--gold-ink)">₹200</div>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:18px 16px 30px;background:linear-gradient(transparent,var(--bg) 35%)"><div style="height:58px;border-radius:18px;background:var(--gold-grad);box-shadow:var(--gold-sh);color:var(--on-gold);display:grid;place-items:center;font-weight:800;font-size:16.5px">Save template</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1180}}">
class Component extends DCLogic {
  renderVals() {
    return {
      presets: ['Teen Patti','Poker','Sequence','Custom'].map((l,i) => ({l, b: i ? 'var(--line)' : 'var(--gold)', bg: i ? 'transparent' : 'var(--gold)', c: i ? 'var(--ink2)' : 'var(--on-gold)'})),
      amounts: [
        {l:'Boot amount',d:'Everyone puts this in to start',v:'₹10'},
        {l:'Min bet',d:'Smallest blind bet',v:'₹10'},
        {l:'Max bet',d:'Pot-limit per turn',v:'₹500'},
      ],
      modes: [
        {l:'Turn mode',d:'Who can bet when',a:'Turn-based',b:'Free-form'},
        {l:'Team mode',d:'How the pot is won',a:'Solo',b:'Teams'},
      ],
    };
  }
}
</script>
</body>
</html>
